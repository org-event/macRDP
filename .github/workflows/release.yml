name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag matches Cargo.toml
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - name: Package
        run: |
          name="openrdp-$GITHUB_REF_NAME-aarch64-apple-darwin"
          mkdir "$name"
          cp target/release/openrdp scripts/openrdp-doctor README.md README.ru.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "$name/"
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "ASSET=$name" >> "$GITHUB_ENV"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          Apple Silicon build. The binary is not notarized: after downloading, run
          `xattr -d com.apple.quarantine openrdp`, then `./openrdp install --user <NAME> --pass <PASSWORD>`.
          `install` signs the app with a local certificate, so later updates keep the macOS permissions.

          See CHANGELOG.md for the changes.
          EOF
          gh release create "$GITHUB_REF_NAME" "$ASSET.tar.gz" "$ASSET.tar.gz.sha256" \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
