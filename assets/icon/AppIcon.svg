<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- macOS app icon grid: an 824×824 rounded square centered on a 1024 canvas. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D5FC9"/>
      <stop offset="1" stop-color="#0A2A66"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.6">
      <stop offset="0" stop-color="#5FA8FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5FA8FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="apple" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#B8F06A"/>
      <stop offset="0.55" stop-color="#5DC24A"/>
      <stop offset="1" stop-color="#2E8A3A"/>
    </linearGradient>
    <radialGradient id="appleShine" cx="0.32" cy="0.28" r="0.35">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8EE05A"/>
      <stop offset="1" stop-color="#2F8F3C"/>
    </linearGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6CC8FF"/>
      <stop offset="1" stop-color="#1F6FE0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000814" flood-opacity="0.45"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#06240F" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background tile -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>

  <!-- Stem and leaf -->
  <path d="M512 336 C512 290 518 250 540 214" fill="none" stroke="#6B4423" stroke-width="24" stroke-linecap="round"/>
  <g transform="rotate(-28 600 238)">
    <ellipse cx="600" cy="238" rx="78" ry="34" fill="url(#leaf)"/>
    <path d="M526 238 Q600 230 672 238" fill="none" stroke="#2A7A34" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- The apple -->
  <g filter="url(#soft)">
    <path d="M512 330
             C560 290 680 270 752 334
             C832 404 834 566 792 664
             C752 760 692 850 622 850
             C582 850 562 830 512 830
             C462 830 442 850 402 850
             C332 850 272 760 232 664
             C190 566 192 404 272 334
             C344 270 464 290 512 330 Z" fill="url(#apple)"/>
  </g>
  <path d="M512 330
           C560 290 680 270 752 334
           C832 404 834 566 792 664
           C752 760 692 850 622 850
           C582 850 562 830 512 830
           C462 830 442 850 402 850
           C332 850 272 760 232 664
           C190 566 192 404 272 334
           C344 270 464 290 512 330 Z" fill="url(#appleShine)"/>

  <!-- The window: frame and four blue panes -->
  <g filter="url(#soft)">
    <rect x="356" y="446" width="312" height="268" rx="30" fill="#F2F7FF"/>
  </g>
  <rect x="378" y="468" width="126" height="104" rx="12" fill="url(#pane)"/>
  <rect x="520" y="468" width="126" height="104" rx="12" fill="url(#pane)"/>
  <rect x="378" y="588" width="126" height="104" rx="12" fill="url(#pane)"/>
  <rect x="520" y="588" width="126" height="104" rx="12" fill="url(#pane)"/>
  <!-- Glare on the glass -->
  <path d="M390 480 L470 480 L404 560 L390 560 Z" fill="#FFFFFF" opacity="0.28"/>
  <path d="M532 480 L612 480 L546 560 L532 560 Z" fill="#FFFFFF" opacity="0.28"/>

  <!-- Remote cursor -->
  <path d="M598 616 L598 782 L638 744 L666 806 L694 794 L666 732 L720 730 Z"
        fill="#FFFFFF" stroke="#0A2A66" stroke-width="12" stroke-linejoin="round"/>
</svg>
