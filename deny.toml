# cargo-deny: https://embarkstudios.github.io/cargo-deny/
# Run with `cargo deny check`.

[graph]
targets = ["aarch64-apple-darwin"]
all-features = true

[advisories]
version = 2
yanked = "deny"
# No release fixes these. They are not reachable holes in this server.
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa via picky/sspi: Marvin timing attack, still unfixed upstream. TLS private-key operations use rustls/aws-lc, not this crate" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile: archived wrapper around the same parser as rustls-pki-types; informational, no vulnerability" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "OpenSSL",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# IronRDP is pinned to a revision with the server-side EGFX we need.
allow-git = ["https://github.com/Devolutions/IronRDP.git"]
